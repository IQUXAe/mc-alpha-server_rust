[package]
name = "alpha_server"
version = "0.1.0"
edition = "2021"
description = "Minecraft Alpha 1.2.6 server implementation in Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/IQUXAe/mc-alpha-server_rust"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
# Only for SIGINT/SIGTERM handling in main.rs; everything else is pure std.
libc = "0.2"
flate2 = "1"
zstd = "0.13"
ureq = "3"
rusty-leveldb = "4"
mio = { version = "1.0", features = ["os-poll", "net"] }

[lints.clippy]
all = "warn"

[lints.rust]
# One `unsafe` remains for the OS signal handler; keep it visible in review.
unsafe_code = "warn"
